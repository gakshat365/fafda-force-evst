[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ebv"
version = "1.0.0"
description = "Machine learning for bird Essential Biodiversity Variables in South India (EVST project 10)"
requires-python = ">=3.11"
dependencies = [
    "numpy", "pandas", "scipy", "scikit-learn", "xgboost", "torch", "shap",
    "rasterio", "shapely", "requests", "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "pyflakes"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
